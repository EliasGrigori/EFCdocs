<style>
/* Tela de abertura (v0.6.10.1: marca Vértice Docs, arte do Elias): aparece na hora, antes do app carregar. Fundo igual ao do logo. */
#abertura{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  font-family:'DejaVu Sans',Verdana,system-ui,sans-serif;color:#ece6d6;text-align:center;padding:24px;
  background:#10222e;
  transition:opacity .28s ease}
#abertura.sai{opacity:0;pointer-events:none}
#abertura img{width:min(380px,82vw);height:auto;margin-bottom:4px}
#abertura h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#abertura p{margin:0;font-size:15px;color:#c9c1b0;letter-spacing:.2px}
#abertura .barra{width:168px;height:6px;border-radius:3px;background:#1d3644;overflow:hidden;margin-top:48px}
#abertura .barra i{display:block;width:40%;height:100%;border-radius:3px;background:#f28b3c;animation:ab-vai 1.2s ease-in-out infinite}
#abertura small{font-size:12.5px;color:#93a3ab;margin-top:8px}
@keyframes ab-vai{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){#abertura .barra i{animation:none;width:60%}}
</style>
<link rel="stylesheet" href="./assets/app-GOIQONG4.css">
</head>
<body>
<div id="abertura" role="status" aria-label="Carregando o Vértice Docs">
  <img src="logo-abertura.png" alt="" width="380" height="160">
  <h1>Vértice Docs</h1>
  <p>Planilha • Documento • Quadro</p>
  <div class="barra"><i></i></div>
  <small>Carregando...</small>
</div>
<div id="raiz"></div>
<script type="module" src="./assets/app-DMOFCP4X.js"></script>
</body>
</html>
